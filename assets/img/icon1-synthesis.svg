<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" role="img" aria-label="나노입자 합성 및 설계">
<defs>
 <radialGradient id="g1" cx="38%" cy="32%"><stop offset="0" stop-color="#5FD8EC"/><stop offset="1" stop-color="#1273B0"/></radialGradient>
 <radialGradient id="g2" cx="38%" cy="32%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9C6D2"/></radialGradient>
 <radialGradient id="g3" cx="38%" cy="32%"><stop offset="0" stop-color="#F0C275"/><stop offset="1" stop-color="#C9803A"/></radialGradient>
 <radialGradient id="glow" cx="50%" cy="50%"><stop offset="0" stop-color="#22B8CF" stop-opacity=".30"/><stop offset="1" stop-color="#22B8CF" stop-opacity="0"/></radialGradient>
</defs>
<rect width="420" height="320" fill="none"/>

<!-- flask, top-left : synthesis -->
<g transform="translate(72,74)" stroke="#0A2540" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M-10 -30 L-10 -12 L-27 20 A19 19 0 0 0 -10 40 L10 40 A19 19 0 0 0 27 20 L10 -12 L10 -30"/>
  <path d="M-17 -30 L17 -30"/>
</g>
<path d="M45 94 A19 19 0 0 0 62 114 L82 114 A19 19 0 0 0 99 94 Z" fill="#22B8CF" opacity=".55"/>
<circle cx="60" cy="104" r="3.6" fill="#1273B0"/><circle cx="78" cy="108" r="2.8" fill="#1273B0"/>
<!-- droplet -->
<path d="M72 20 C72 20 64 32 64 38 A8 8 0 0 0 80 38 C80 32 72 20 72 20Z" fill="#22B8CF"/>

<!-- arrow flask -> cluster -->
<path d="M118 96 L160 96" stroke="#1273B0" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/>
<path d="M156 89 L168 96 L156 103 Z" fill="#1273B0"/>

<!-- central multi-element cluster -->
<circle cx="248" cy="112" r="74" fill="url(#glow)"/>
<g>
  <circle cx="248" cy="112" r="26" fill="url(#g1)"/>
  <circle cx="214" cy="96"  r="19" fill="url(#g2)"/>
  <circle cx="282" cy="94"  r="18" fill="url(#g3)"/>
  <circle cx="212" cy="134" r="17" fill="url(#g3)"/>
  <circle cx="284" cy="136" r="20" fill="url(#g2)"/>
  <circle cx="248" cy="70"  r="16" fill="url(#g2)"/>
  <circle cx="248" cy="156" r="15" fill="url(#g1)"/>
  <circle cx="192" cy="114" r="13" fill="url(#g1)"/>
  <circle cx="306" cy="114" r="13" fill="url(#g2)"/>
</g>

<!-- control axes -->
<g font-family="Pretendard, Arial, sans-serif">
  <!-- size -->
  <g transform="translate(74,208)">
    <circle cx="0"  cy="0" r="4"  fill="#1273B0"/>
    <circle cx="18" cy="0" r="7"  fill="#1273B0"/>
    <circle cx="44" cy="0" r="11" fill="#1273B0"/>
    <text x="22" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2540">Size</text>
    <text x="22" y="55" text-anchor="middle" font-size="12.5" fill="#5A6B7C">크기</text>
  </g>
  <!-- composition -->
  <g transform="translate(196,208)">
    <circle cx="-14" cy="0" r="9" fill="url(#g1)"/>
    <circle cx="6"   cy="0" r="9" fill="url(#g2)"/>
    <circle cx="26"  cy="0" r="9" fill="url(#g3)"/>
    <text x="6" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2540">Composition</text>
    <text x="6" y="55" text-anchor="middle" font-size="12.5" fill="#5A6B7C">조성</text>
  </g>
  <!-- shape -->
  <g transform="translate(324,208)">
    <circle cx="-16" cy="0" r="9" fill="#1273B0"/>
    <rect x="-2" y="-9" width="18" height="18" rx="2" fill="#8FA8BC"/>
    <path d="M32 -10 L43 9 L21 9 Z" fill="#C9803A"/>
    <text x="12" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2540">Shape</text>
    <text x="12" y="55" text-anchor="middle" font-size="12.5" fill="#5A6B7C">형상</text>
  </g>
</g>
</svg>