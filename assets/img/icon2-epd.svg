<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" role="img" aria-label="전기영동증착">
<defs>
 <linearGradient id="bath" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#DCEEF7"/><stop offset="1" stop-color="#BBDCEE"/></linearGradient>
 <radialGradient id="pg" cx="36%" cy="30%"><stop offset="0" stop-color="#5FB6E0"/><stop offset="1" stop-color="#1361A0"/></radialGradient>
</defs>

<!-- power supply -->
<rect x="150" y="14" width="120" height="40" rx="8" fill="#FFF" stroke="#0A2540" stroke-width="3.5"/>
<text x="176" y="42" font-size="24" font-weight="700" fill="#C0392B" font-family="Arial">+</text>
<rect x="204" y="24" width="4" height="20" fill="#0A2540"/><rect x="214" y="28" width="4" height="12" fill="#0A2540"/>
<text x="236" y="42" font-size="26" font-weight="700" fill="#1273B0" font-family="Arial">–</text>
<path d="M150 34 L96 34 L96 78" stroke="#C0392B" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M270 34 L326 34 L326 78" stroke="#1273B0" stroke-width="5" fill="none" stroke-linecap="round"/>

<!-- bath -->
<rect x="52" y="78" width="316" height="176" rx="10" fill="url(#bath)" stroke="#0A2540" stroke-width="3.5"/>

<!-- anode (+) -->
<rect x="84" y="92" width="24" height="148" rx="4" fill="#C0392B"/>
<text x="96" y="176" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="Arial">+</text>
<!-- cathode (-) -->
<rect x="314" y="92" width="24" height="148" rx="4" fill="#1B4E7A"/>
<text x="326" y="176" text-anchor="middle" font-size="24" font-weight="700" fill="#fff" font-family="Arial">–</text>

<!-- charged particles migrating right -->
<g>
  <g transform="translate(140,120)"><circle r="9" fill="url(#pg)"/><circle cx="14" cy="-9" r="6.5" fill="none" stroke="#1273B0" stroke-width="2"/><text x="14" y="-5" text-anchor="middle" font-size="10" font-weight="700" fill="#1273B0" font-family="Arial">+</text></g>
  <g transform="translate(146,180)"><circle r="8" fill="url(#pg)"/><circle cx="13" cy="-9" r="6" fill="none" stroke="#1273B0" stroke-width="2"/><text x="13" y="-5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1273B0" font-family="Arial">+</text></g>
  <g transform="translate(196,150)"><circle r="9" fill="url(#pg)"/><circle cx="14" cy="-9" r="6.5" fill="none" stroke="#1273B0" stroke-width="2"/><text x="14" y="-5" text-anchor="middle" font-size="10" font-weight="700" fill="#1273B0" font-family="Arial">+</text></g>
  <g transform="translate(190,214)"><circle r="7.5" fill="url(#pg)"/><circle cx="12" cy="-8" r="5.5" fill="none" stroke="#1273B0" stroke-width="2"/><text x="12" y="-4.5" text-anchor="middle" font-size="9" font-weight="700" fill="#1273B0" font-family="Arial">+</text></g>
</g>
<g stroke="#1273B0" stroke-width="2.6" fill="none" stroke-dasharray="6 6" stroke-linecap="round">
  <path d="M164 118 C210 112 236 118 264 128"/>
  <path d="M170 178 C214 176 240 172 264 166"/>
  <path d="M220 148 C240 146 252 146 264 148"/>
  <path d="M212 212 C238 210 250 202 264 194"/>
</g>
<g fill="#1273B0">
  <path d="M262 122 L274 128 L262 134 Z"/><path d="M262 160 L274 166 L262 172 Z"/>
  <path d="M262 142 L274 148 L262 154 Z"/><path d="M262 188 L274 194 L262 200 Z"/>
</g>

<!-- porous 3D deposit on cathode -->
<g fill="url(#pg)">
  <g id="frame">
    <circle cx="288" cy="102" r="7"/><circle cx="300" cy="98" r="7"/><circle cx="276" cy="112" r="7"/>
    <circle cx="288" cy="126" r="7"/><circle cx="288" cy="150" r="7"/><circle cx="288" cy="174" r="7"/>
    <circle cx="288" cy="198" r="7"/><circle cx="288" cy="222" r="7"/><circle cx="300" cy="230" r="7"/>
    <circle cx="276" cy="136" r="7"/><circle cx="276" cy="188" r="7"/><circle cx="276" cy="212" r="7"/>
    <circle cx="302" cy="120" r="7"/><circle cx="302" cy="146" r="7"/><circle cx="302" cy="172" r="7"/>
    <circle cx="302" cy="198" r="7"/><circle cx="264" cy="102" r="6.5"/><circle cx="264" cy="230" r="6.5"/>
    <circle cx="264" cy="166" r="6.5"/><circle cx="252" cy="118" r="6"/><circle cx="252" cy="214" r="6"/>
  </g>
</g>

<!-- caption strip -->
<g font-family="Pretendard, Arial, sans-serif">
  <text x="210" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#0A2540">하전 입자 → 전기장 이동 → 3차원 다공 전극</text>
  <text x="210" y="308" text-anchor="middle" font-size="12.5" fill="#5A6B7C">Charged particles · Field-driven migration · Porous 3D electrode</text>
</g>
</svg>